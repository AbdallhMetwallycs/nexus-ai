[package]
name = "nexus-kb"
version = "0.1.0"
edition = "2021"
description = "Local document parsing, chunking and hashed-vector retrieval for NEXUS AI"

[dependencies]
lopdf = "0.35"
calamine = "0.26"
csv = "1.3"
zip = { version = "=2.2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"

[dev-dependencies]
tempfile = "3"
